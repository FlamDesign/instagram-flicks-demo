<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Flicks on Instagram: Concept Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000;background:#e9eaee;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block}
svg{display:block}
#stage{height:100%;display:grid;place-items:center}
#phone{--sbh:47px;position:relative;width:414px;height:868px;border-radius:56px;background:#0b0b0c;padding:12px;box-shadow:0 0 0 2px #2a2a2d,0 30px 80px rgba(20,22,30,.35);transform-origin:50% 50%}
#app{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;isolation:isolate}
.sb{position:absolute;left:0;right:0;top:0;height:var(--sbh);z-index:70;display:flex;align-items:center;justify-content:space-between;padding:14px 30px 0 44px;font-weight:600;font-size:16px;letter-spacing:-.2px;pointer-events:none;color:#000;transition:color .2s}
.dark .sb{color:#fff}
.sb .isl{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000}
.sb .r{display:flex;gap:6px;align-items:center}
.view{position:absolute;inset:0 0 50px 0;display:none;flex-direction:column}
.view.on{display:flex}

.hd{flex:none;padding-top:var(--sbh);background:#fff}
.hd .row{height:46px;display:flex;align-items:center;padding:0 14px 0 16px}
.wm{font-size:23px;font-weight:700;letter-spacing:-.9px}
.hd .ic{margin-left:auto;display:flex;gap:22px}
.dot{position:relative}
.dot::after{content:"";position:absolute;right:-2px;top:-1px;width:8px;height:8px;border-radius:50%;background:#ff3040;box-shadow:0 0 0 1.5px #fff}
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#fff}
.feed::-webkit-scrollbar,.reels::-webkit-scrollbar,.tray::-webkit-scrollbar{display:none}

.ring{width:70px;height:70px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7);position:relative}
.ring.seen{background:#dbdbdb;padding:1.5px}
.ring.me{background:none;padding:2.5px}
.ring i{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;background:#efefef center/cover}
.ring.me b{position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:#0095f6;border:2.5px solid #fff;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:500;line-height:1}

.post{padding-bottom:12px;position:relative}
.ph{height:54px;display:flex;align-items:center;gap:10px;padding:0 12px}

.ph .who small{font-size:11.5px;color:#262626}
.ph .more{margin-left:auto}
.media{position:relative;background:#efefef;overflow:hidden}
.media.o{aspect-ratio:4/5}

.ctab{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 14px;font-weight:600;font-size:14px;border-bottom:.5px solid #dbdbdb;transition:background .35s,color .35s;text-align:left}
.ctab.hot{background:#0095f6;color:#fff;border-color:#0095f6}
.ctab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:center;gap:14px;padding:10px 12px 6px}
.act button{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600}
.act .sv{margin-left:auto}
.liked svg{fill:#ff3040;stroke:#ff3040}
.saved svg{fill:#000}
.cap{padding:0 14px;font-size:13.5px;line-height:1.4}
.cap b{font-weight:600}
.when{padding:4px 14px 0;font-size:12px;color:#737373}
.vf{flex:none}

.flick{position:absolute;inset:0;overflow:hidden;background:#0d0d0f}
.flick iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block}
.fstate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .4s}

.fstate.hide{opacity:0}
.fwarn{position:absolute;left:8px;bottom:8px;font-size:11px;background:#b3261e;color:#fff;border-radius:6px;padding:3px 6px}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{position:absolute;left:0;right:0;bottom:0;height:50px;z-index:20;display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:.5px solid #dbdbdb;padding:0 6px}
.dark .tabs{background:#000;border-color:#262626;color:#fff}
.tabs button{width:50px;height:44px;display:grid;place-items:center}
.tabs .pf{width:26px;height:26px;border-radius:50%;background:#efefef center/cover;box-shadow:0 0 0 1px #dbdbdb}

#v-reels{background:#000;color:#fff}
.rhd{position:absolute;left:0;right:0;top:var(--sbh);z-index:6;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:22px;font-weight:700;letter-spacing:-.4px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.35);transition:opacity .2s}
.onad .rhd{opacity:0}
.reels{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.reel .bg{position:absolute;inset:-6%;background:#111 center/cover;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.14) translateY(-2.5%)}}
.reel .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 22%,transparent 55%,rgba(0,0,0,.62));pointer-events:none}
.rmeta{position:absolute;left:14px;right:76px;bottom:16px;font-size:13.5px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.rmeta .u{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-weight:600}
.fol{height:28px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.8);font-size:13px;font-weight:600;color:#fff;text-shadow:none}
.rmeta p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.rmeta .au{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px}
.rail{position:absolute;right:8px;bottom:14px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:16px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;width:48px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rail .liked svg{fill:#ff3040;stroke:#ff3040}
.rail .disc{width:26px;height:26px;border-radius:7px;border:2px solid #fff;background:#333 center/cover}
.radw{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sbh)}
.rbox{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.rfl{position:relative;width:min(100cqw,calc(100cqh * 9 / 16));height:min(100cqh,calc(100cqw * 16 / 9));overflow:hidden}
.rfl .rail{top:11%;bottom:auto;right:4px;gap:13px}
.rstrip{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13.5px}
.rstrip .who{line-height:1.2;min-width:0}
.rstrip .who b{font-weight:600;display:flex;align-items:center;gap:4px}
.rstrip .who small{font-size:11.5px;color:#d0d0d0}
.rstrip .fol{margin-left:auto;border-color:#555}

#story{position:absolute;inset:0;z-index:40;background:#000;color:#fff;display:none;flex-direction:column;padding-top:var(--sbh)}
#story.on{display:flex}
.smedia{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#111}
.smedia>img{width:100%;height:100%;object-fit:cover}
.shd{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px 8px 22px;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent);pointer-events:none}
.bars{display:flex;gap:3px}
.bars i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.38);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.shd .u{display:flex;align-items:center;gap:9px;margin-top:10px;padding:0 4px;font-size:13.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.shd .u small{font-weight:400;font-size:12.5px;opacity:.9}
.shd .u .sp{line-height:1.2}
.shd .u .sp small{display:block}
.shd .x{margin-left:auto;display:flex;gap:14px;align-items:center;pointer-events:auto}
.tz{position:absolute;top:0;bottom:0;z-index:1}
.tz.l{left:0;width:32%}
.tz.r{right:0;width:68%}
.sfl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:1;z-index:2}
.sfoot{flex:none;height:64px;display:flex;align-items:center;gap:14px;padding:0 14px}
.sfoot .in{flex:1;height:42px;border-radius:22px;border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;padding:0 16px;font-size:14px;color:#fff}
.sfoot .go{margin:0 auto;height:40px;padding:0 20px;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;max-width:100%}
.sfoot .go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#sheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#sheet.on{display:flex}
.web{width:100%;height:90%;background:#fff;color:#000;border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.web .bar{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:.5px solid #dbdbdb}
.web .url{flex:1;text-align:center;line-height:1.2;min-width:0}
.web .url b{display:flex;justify-content:center;align-items:center;gap:5px;font-size:14px;font-weight:600}
.web .url small{font-size:11.5px;color:#737373}
.web .ld{height:2px;background:#0095f6;width:0;animation:ld 1.1s ease-out forwards}
@keyframes ld{to{width:100%;opacity:0}}
.web .bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center}
.web .bd .av{width:64px;height:64px}
.web .bd h3{font-size:18px;font-weight:700;margin-top:6px}
.web .bd p{color:#737373;font-size:13.5px;max-width:270px}
.web .bd a{margin-top:10px;height:44px;padding:0 22px;border-radius:10px;background:#0095f6;color:#fff;font-weight:600;display:flex;align-items:center;text-decoration:none}

.pulse::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;border-radius:inherit;animation:pulse 2.4s ease-out 1 forwards}
@keyframes pulse{0%{box-shadow:inset 0 0 0 0 #f5c518}15%,60%{box-shadow:inset 0 0 0 4px #f5c518}100%{box-shadow:inset 0 0 0 4px transparent}}

.gpill{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#1b1f23;color:#f2f2f2;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.gpill:hover{background:#2a2f34}
.gpill i{font-style:normal;background:#0095f6;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.gscrim{position:fixed;inset:0;z-index:88;display:none}
.gscrim.on{display:block}
.gpanel{position:fixed;right:24px;bottom:74px;z-index:89;width:300px;background:#1b1f23;color:#f2f2f2;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:6px 6px 8px;display:none}
.gpanel.on{display:block}
.gpanel h6{margin:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9aa1a8}
.gitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:40px;padding:6px 10px;border-radius:8px;font-size:13.5px}
.gitem:hover{background:#2c3238}
.gitem.cur{background:#21364d}
.gitem .n{width:18px;flex:none;color:#9aa1a8;font-size:12px}
.gitem .b{margin-left:auto;font-size:11px;color:#9aa1a8;flex:none}

#dm{position:absolute;inset:0;z-index:40;background:#fff;display:none;flex-direction:column;padding-top:var(--sbh)}
#dm.on{display:flex}
.dmh{flex:none;height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:18px;font-weight:700;border-bottom:.5px solid #efefef}
.dmh .who{line-height:1.2;font-size:14.5px;min-width:0}
.dmh .who b{font-weight:600;display:flex;align-items:center;gap:4px}
.dmh .who small{font-size:11.5px;color:#737373;font-weight:400}
.dmh .sp{margin-left:auto;display:flex;gap:18px}
.dml{flex:1;overflow-y:auto;scrollbar-width:none;padding-top:6px}
.dmr{display:flex;align-items:center;gap:12px;width:100%;padding:8px 16px;text-align:left}
.dmr .t{flex:1;min-width:0;line-height:1.3}
.dmr .t b{font-weight:400;font-size:14.5px;display:flex;align-items:center;gap:4px}
.dmr .t span{display:block;font-size:13.5px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmr.un .t b{font-weight:700}
.dmr.un .t span{color:#000;font-weight:600}
.dmr .ud{width:8px;height:8px;border-radius:50%;background:#0095f6;flex:none}
.dmb{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.dmb .ts{align-self:center;font-size:12px;color:#737373;margin:8px 0 10px}
.bub{align-self:flex-start;max-width:74%;margin-left:40px;background:#efefef;border-radius:20px;padding:9px 14px;font-size:14.5px;line-height:1.35}
.brow{display:flex;align-items:flex-end;gap:8px}
.brow .bub{margin-left:0}
.fcard{align-self:flex-start;margin-left:40px;width:266px;max-width:74%;border-radius:20px;overflow:hidden;background:#efefef;position:relative}
.fcard .fm{position:relative}
.fcard .cb{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 14px;font-weight:600;font-size:14px;text-align:left}
.fcard .cb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmc{flex:none;margin:6px 12px 12px;height:44px;border-radius:22px;background:#efefef;display:flex;align-items:center;gap:10px;padding:0 14px 0 5px;color:#737373;font-size:14.5px}
.dmc i{width:34px;height:34px;border-radius:50%;background:#3797f0;color:#fff;display:grid;place-items:center}
.dmc span{flex:1}
.srch{margin:8px 14px 10px;height:36px;border-radius:10px;background:#efefef;display:flex;align-items:center;gap:8px;padding:0 12px;color:#737373;font-size:15px}
.xgrid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;grid-auto-flow:dense;align-content:start;scrollbar-width:none;background:#fff}
.xgrid::-webkit-scrollbar{display:none}
.xt{position:relative;aspect-ratio:1;background:#efefef center/cover;overflow:hidden;color:#fff}
.xt.big{grid-column:1/span 2;grid-row:span 2;aspect-ratio:auto}
.xt.big.r{grid-column:2/span 2}
.xt .ri{position:absolute;right:7px;top:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.rfl .rail{top:auto;bottom:12px;right:6px;gap:16px}
.rfl .shade2{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,transparent 66%,rgba(0,0,0,.62))}
.rinfo{position:absolute;left:14px;right:70px;bottom:12px;z-index:4;pointer-events:none;font-size:13.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.rinfo .u{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.rinfo .who{line-height:1.2}
.rinfo .who b{font-weight:600;display:flex;align-items:center;gap:4px}
.rinfo .who small{font-size:11.5px}
.rinfo p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstrip{padding:0 12px}
.rcta{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:14px;transition:background .35s,color .35s;text-align:left}
.rcta.hot{background:#fff;color:#000}
.rcta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st small{font-size:10px;color:#737373;margin-top:-5px}
.ring i.bl{display:grid;place-items:center;overflow:hidden;font-weight:800;font-style:normal}
@media (max-width:600px){
  body{background:#000}
  #stage{display:block}
  #phone{--sbh:0px;width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}
  #app{border-radius:0}
  .sb{display:none}
  .gpill{right:8px;bottom:auto;top:56px;height:32px;padding:0 10px;font-size:12px;gap:6px;background:rgba(27,31,35,.92)}
  .gpanel{right:8px;left:auto;bottom:auto;top:94px;width:min(300px,calc(100vw - 16px))}
  .at-home .gpill{top:7px;right:98px}

}
</style>

<div id="stage"><div id="phone">
  <div id="app">

<script>
const U = (id,w,h) => `https://images.unsplash.com/photo-${id}?w=${w}&h=${h}&q=80&auto=format&fit=crop`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const CFG_DV = 'window.AD_CONFIG=window.AD_CONFIG||{};window.AD_CONFIG.dsp="dv360_studio";window.AD_CONFIG.clickTracker={"mode":"exit","template":""};';
const CFG_H = 'window.AD_CONFIG=window.AD_CONFIG||{};window.AD_CONFIG.dsp="house";window.AD_CONFIG.clickTracker={"mode":"exit","template":""};';

const FEED = [
  {a:"coast", loc:"Positano, Italy", img:"1561956021-947f09ae0101", likes:"4,812", com:"96", cap:"Woke up to this. Staying one more night.", when:"2 hours ago"},
  {ad:"gap", likes:"12.4K", com:"208", cap:"Three fall layers, one video. Tap a look to switch it."},
  {a:"dog", loc:"Cannon Beach, Oregon", img:"1530281700549-e82e7bf110d6", likes:"1,930", com:"74", cap:"Zero thoughts. Just beach.", when:"5 hours ago"},
  {ad:"merc", likes:"18.3K", com:"412", cap:"The new S-Class. Pick a finish in the video."},
  {a:"home", img:"1583847268964-b28dc8f51f92", likes:"2,247", com:"41", cap:"Sunday light in the front room. Nothing styled, promise.", when:"8 hours ago"},
  {ad:"lego", likes:"26.1K", com:"538", cap:"Small brick. Big possibilities. Tap a car to switch the build."},
  {a:"tokyo", loc:"Shinjuku, Tokyo", img:"1601042879364-f3947d3f9c16", likes:"9,574", com:"152", cap:"Rain makes this city twice as bright.", when:"1 day ago"}
];
function actions(likes,com){
  return `<div class="act"><button onclick="this.classList.toggle('liked')" aria-label="Like">${I.heart(25)}${likes}</button><button aria-label="Comment">${I.chat(25)}${com}</button><button aria-label="Share">${I.send(25)}</button><button class="sv" onclick="this.classList.toggle('saved')" aria-label="Save">${I.save(25)}</button></div>`;
}
function renderFeed(){
  const tray = `<div class="tray"><button class="st"><span class="ring me"><i style="background-image:url(${U(ME,160,160)})"></i><b>+</b></span><span class="l">Your story</span></button>` +
    STORIES.map((p,i)=>p.ad?`<button class="st" onclick="openStory(${i})"><span class="ring"><i class="bl" style="background:${BR[p.ad].color};color:${BR[p.ad].fg||"#fff"}"><span style="${BR[p.ad].ls};transform:scale(1.9);display:block">${BR[p.ad].logo}</span></i></span><span class="l">${BR[p.ad].h}</span><small>Sponsored</small></button>`:`<button class="st" onclick="openStory(${i})"><span class="ring"><i style="background-image:url(${U(AC[p.a].av,160,160)})"></i></span><span class="l">${AC[p.a].h}</span></button>`).join("") + `</div>`;
  $("#feed").innerHTML = tray + FEED.map(p=>{
    if(p.ad){ const B=BR[p.ad], host=flickHost(p.ad), id="s"+slotSeq;
      return `<article class="post" data-fmt="feed"><div class="ph">${bav(p.ad)}<div class="who"><b>${B.h}${I.vf}</b><small>Sponsored</small></div><button class="more" aria-label="More">${I.more(22)}</button></div>
        <div class="media q">${host}</div>
        <button class="ctab" onclick="openSite('${id}')"><span data-cta="${id}">${B.cta}</span>${I.chev(18)}</button>
        ${actions(p.likes,p.com)}<div class="cap"><b>${B.h}</b> ${esc(p.cap)}</div></article>`; }
    const A=AC[p.a];
    return `<article class="post"><div class="ph">${pav(A.av)}<div class="who"><b>${A.h}</b>${p.loc?`<small>${p.loc}</small>`:""}</div><button class="more" aria-label="More">${I.more(22)}</button></div>
      <div class="media o"><img src="${U(p.img,900,1125)}" alt="" loading="lazy"></div>
      ${actions(p.likes,p.com)}<div class="cap"><b>${A.h}</b> ${esc(p.cap)}</div><div class="when">${p.when}</div></article>`;
  }).join("");
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    const post=en.target.closest(".post"), bar=post.querySelector(".ctab");
    if(en.isIntersecting){ mountOne(en.target); clearTimeout(bar._t); bar._t=setTimeout(()=>bar.classList.add("hot"),2600); }
    else { unmountOne(en.target); clearTimeout(bar._t); bar.classList.remove("hot"); }
  }),{root:$("#feed"),rootMargin:"120px 0px"});
  $("#feed").querySelectorAll(".flick").forEach(h=>io.observe(h));
}

// ---------- reels ----------
const REELS = [
  {ad:"zara", likes:"21.7K", com:"340", sh:"1,205", cap:"Three bombers, one Reel. Tap to switch."},
  {a:"surf", img:"1559962219-f52ccd86944e", likes:"48.2K", com:"612", sh:"3,104", cap:"Dawn patrol. Nobody out but us.", au:"Original audio"},
  {ad:"acer", likes:"9,481", com:"175", sh:"602", cap:"Three laptops, one Reel. Tap to compare."},
  {a:"trail", img:"1761027436967-63584b301a77", likes:"17.9K", com:"228", sh:"954", cap:"Last mile before the ridge. Worth every step.", au:"Original audio"},
  {a:"tokyo", img:"1586165877141-3dbcfc059283", likes:"63.5K", com:"1,048", sh:"7,730", cap:"The quiet streets are the best ones.", au:"Original audio"}
];
function rail(r,img){
  return `<div class="rail"><button onclick="this.classList.toggle('liked')" aria-label="Like">${I.heart(27)}${r.likes}</button><button aria-label="Comment">${I.chat(27)}${r.com}</button><button aria-label="Share">${I.send(27)}${r.sh}</button><button aria-label="More">${I.more(24)}</button>${img?`<span class="disc" style="background-image:url(${U(img,80,80)})"></span>`:""}</div>`;
}
function renderReels(){
  $("#reels").innerHTML = REELS.map(r=>{
    if(r.ad){ const B=BR[r.ad], host=flickHost(r.ad), id="s"+slotSeq; SLOTS[id].reel=B.reel;
      return `<div class="reel" data-fmt="reels"><div class="radw"><div class="rbox"><div class="rfl">${host}<div class="shade2"></div><div class="rinfo"><div class="u">${bav(r.ad)}<div class="who"><b>${B.h}${I.vf}</b><small>Sponsored</small></div></div><p>${esc(r.cap)}</p></div>${rail(r)}</div></div>
        <div class="rstrip"><button class="rcta" onclick="openSite('${id}')"><span data-cta="${id}">${B.cta}</span>${I.chev(18)}</button></div></div></div>`; }
    const A=AC[r.a];
    return `<div class="reel"><div class="bg" style="background-image:url(${U(r.img,900,1600)})"></div><div class="shade"></div>
      <div class="rmeta"><div class="u">${pav(A.av)}<span>${A.h}</span><button class="fol">Follow</button></div><p>${esc(r.cap)}</p><div class="au">${I.note(12)}<span>${A.h} · ${r.au}</span></div></div>${rail(r,A.av)}</div>`;
  }).join("");
  const io=new IntersectionObserver(es=>es.forEach(en=>{ en.isIntersecting ? mountOne(en.target) : unmountOne(en.target); $("#v-reels").classList.toggle("onad", !!$("#reels .flick iframe")); const bar=en.target.closest(".reel").querySelector(".rcta"); clearTimeout(bar._t); if(en.isIntersecting) bar._t=setTimeout(()=>bar.classList.add("hot"),2600); else bar.classList.remove("hot"); }),{root:$("#reels"),threshold:.5});
  $("#reels").querySelectorAll(".flick").forEach(h=>io.observe(h));
}

// ---------- explore ----------
const XPH = ["1761309557847-ee63aed92a52","1760615303284-64a42fac2e98","1724582586458-a51791349977","1559627755-42212e5c5fdf","1618397806621-290788301ced","1687270282079-58b4689fed0f","1633321088768-b994237c8aa8","1626736637845-53045bb9695b","1634822929277-0c51ca0e8846","1552258698-f1a0635b71a8","1748199866497-98739ad95701","1581416271259-abec87515f51","1615233500064-caa995e2f9dd","1663756915436-c6842b9d3eb0","1604604994333-f1b0e9471186"];
const XFL = ["levis","bentley","bose"];
function renderExplore(){
  const pat = ["F","s","s","s","s","s","s","Fr","s","s","s","s","F","s","s","s","s","s"];
  let pi=0, fi=0;
  $("#xgrid").innerHTML = pat.map(k=>{
    if(k==="s"){ const id=XPH[pi++%XPH.length]; return `<div class="xt" style="background-image:url(${U(id,400,400)})">${pi%4===2?`<span class="ri">${I.reel(18,true)}</span>`:""}</div>`; }
    return `<div class="xt big${k==="Fr"?" r":""}" data-fmt="explore">${flickHost(XFL[fi++])}</div>`;
  }).join("");
  const io=new IntersectionObserver(es=>es.forEach(en=>{ en.isIntersecting ? mountOne(en.target) : unmountOne(en.target); }),{root:$("#xgrid"),rootMargin:"60px 0px"});
  $("#xgrid").querySelectorAll(".flick").forEach(h=>io.observe(h));
}

// ---------- messages ----------
const DMS = [
  {b:"nike", t:"2m", un:1, msgs:["Universa is here. Three looks, built to move with you.","Tap a look in the video to switch it."]},
  {a:"coast", t:"1h", pv:"Sent a reel by saltline.surf"},
  {b:"airbnb", t:"3h", un:1, msgs:["Your next stay, three ways.","Tap a home in the video to step inside."]},
  {a:"dog", t:"5h", pv:"Liked a message"},
  {b:"bark", t:"1d", msgs:["This month's box just dropped.","Tap a toy in the video to see it in action."]},
  {a:"home", t:"1d", pv:"Seen yesterday"},
  {a:"trail", t:"2d", pv:"That ridge though"}
];
const DM = {on:false};
const BACK = `<span style="display:block;transform:scaleX(-1)">${I.chev(26)}</span>`;
function openDM(i){ closeStory(); show("home"); DM.on=true; $("#dm").classList.add("on"); setDark(); i==null ? drawInbox() : drawThread(i); }
function closeDM(){ if(!DM.on) return; const h=$("#dm .flick"); h&&unmountOne(h); DM.on=false; $("#dm").classList.remove("on"); $("#dm").innerHTML=""; setDark(); }
function drawInbox(){
  const h=$("#dm .flick"); h&&unmountOne(h);
  $("#dm").innerHTML=`<div class="dmh"><button onclick="closeDM()" aria-label="Back">${BACK}</button><span>Messages</span><span class="sp">${I.plus(25)}</span></div><div class="dml">`+
    DMS.map((d,i)=>{ const B=d.b&&BR[d.b], A=d.a&&AC[d.a];
      return `<button class="dmr ${d.un?"un":""}" ${B?`onclick="drawThread(${i})"`:""}>${B?bav(d.b,56):pav(A.av,56)}<span class="t"><b>${B?B.h+I.vf:A.h}</b><span>${esc(B?d.msgs[d.msgs.length-1]:d.pv)} · ${d.t}</span></span>${d.un?`<i class="ud"></i>`:""}${I.cam(24)}</button>`; }).join("")+`</div>`;
}
function drawThread(i){
  const d=DMS[i], B=BR[d.b], host=flickHost(d.b), id="s"+slotSeq; d.un=0;
  $("#dm").innerHTML=`<div class="dmh"><button onclick="drawInbox()" aria-label="Back">${BACK}</button>${bav(d.b,34)}<div class="who"><b>${B.h}${I.vf}</b><small>Business chat</small></div><span class="sp">${I.more(24)}</span></div>
    <div class="dmb"><div class="ts">Today</div><div class="bub">${esc(d.msgs[0])}</div>
      <div class="fcard" data-fmt="dm"><div class="fm" style="aspect-ratio:${B.base[0]}/${B.base[1]}">${host}</div><button class="cb" onclick="openSite('${id}')"><span data-cta="${id}">${B.cta}</span>${I.chev(18)}</button></div>
      <div class="brow">${bav(d.b,32)}<div class="bub">${esc(d.msgs[1])}</div></div></div>
    <div class="dmc"><i>${I.cam(20)}</i><span>Message...</span>${I.heart(24)}</div>`;
  mountOne($("#dm .flick"));
}

// ---------- stories ----------
const STORIES = [
  {ad:"coach"},
  {a:"coast", items:["1534250617995-d16425086b91","1564671546498-09a366692274"], t:"2h"},
  {ad:"cad"},
  {a:"dog", items:["1591160690555-5debfba289f0"], t:"4h"},
  {ad:"nike"},
  {a:"home", items:["1600210491892-03d54c0aaf87","1648536474504-7bbf8a1ee3ab"], t:"6h"},
  {a:"trail", items:["1786273065253-42dc8073e061"], t:"9h"},
  {a:"tokyo", items:["1573455494057-12684d151bf4"], t:"11h"}
];
const ST = {on:false, p:0, i:0, t0:0, el:0, hold:false, timer:0, slot:null};
function openStory(p){ ST.on=true; ST.p=p; ST.i=0; $("#story").classList.add("on"); setDark(); drawStory(); clearInterval(ST.timer); ST.timer=setInterval(tick,50); }
function closeStory(){ if(!ST.on) return; ST.on=false; clearInterval(ST.timer); const h=$("#story .flick"); h&&unmountOne(h); $("#story").classList.remove("on"); $("#story").innerHTML=""; setDark(); }
function drawStory(){
  const pg=STORIES[ST.p], old=$("#story .flick"); old&&unmountOne(old);
  const n=pg.ad?1:pg.items.length;
  const bars=`<div class="bars">${Array.from({length:n},(_,k)=>`<i><b style="width:${k<ST.i?100:0}%"></b></i>`).join("")}</div>`;
  const close=`<span class="x"><button aria-label="More">${I.more(22)}</button><button onclick="closeStory()" aria-label="Close">${I.x(24)}</button></span>`;
  const zones=`<button class="tz l" onclick="stepStory(-1)" aria-label="Previous"></button><button class="tz r" onclick="stepStory(1)" aria-label="Next"></button>`;
  if(pg.ad){ const B=BR[pg.ad], host=flickHost(pg.ad), id="s"+slotSeq; ST.slot=id;
    $("#story").innerHTML=`<div class="smedia" data-fmt="stories" style="background:${B.grad}"><div class="shd">${bars}<div class="u">${bav(pg.ad)}<span class="sp">${B.h} ${I.vf.replace('class="vf"','class="vf" style="display:inline;vertical-align:-2px"')}<small>Sponsored</small></span>${close}</div></div>${zones}<div class="sfl">${host}</div></div>
      <div class="sfoot"><button class="go" onclick="openSite('${id}')"><span data-cta="${id}">${B.cta}</span>${I.chev(16)}</button></div>`;
    mountOne($("#story .flick"));
  } else { const A=AC[pg.a]; ST.slot=null;
    $("#story").innerHTML=`<div class="smedia"><img src="${U(pg.items[ST.i],900,1600)}" alt=""><div class="shd">${bars}<div class="u">${pav(A.av)}<span>${A.h} <small>${pg.t}</small></span>${close}</div></div>${zones}</div>
      <div class="sfoot"><span class="in">Send message</span>${I.heart(26)}${I.send(26)}</div>`;
  }
  ST.t0=Date.now(); ST.el=0;
}
function tick(){
  if(!ST.on||ST.hold) return;
  const dur = STORIES[ST.p].ad ? 20000 : 5000;
  ST.el=Date.now()-ST.t0;
  const b=document.querySelectorAll("#story .bars b")[ST.i]; if(b) b.style.width=Math.min(100,ST.el/dur*100)+"%";
  if(ST.el>=dur) stepStory(1);
}
function stepStory(d){
  const pg=STORIES[ST.p], n=pg.ad?1:pg.items.length;
  let i=ST.i+d, p=ST.p;
  if(i>=n){ p++; i=0; } else if(i<0){ p--; i=0; }
  if(p<0){ p=0; i=0; }
  if(p>=STORIES.length) return closeStory();
  ST.p=p; ST.i=i; drawStory();
}
addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#sheet").classList.contains("on")) closeSite(); else if(ST.on) closeStory(); else closeDM(); toggleGuide(false); }
  if(ST.on && !ST.hold){ if(e.key==="ArrowRight") stepStory(1); if(e.key==="ArrowLeft") stepStory(-1); }
});

// ---------- shell ----------
let VIEW="home";
function setDark(){ $("#phone").classList.toggle("dark", ST.on || VIEW==="reels"); document.body.classList.toggle("at-home", VIEW==="home" && !ST.on && !DM.on); }
function show(v){
  VIEW=v; $("#v-home").classList.toggle("on",v==="home"); $("#v-reels").classList.toggle("on",v==="reels"); $("#v-explore").classList.toggle("on",v==="explore");
  if(v==="reels") $("#reels").scrollTop=0;
  $("#tabs").innerHTML=`<button onclick="show('home')" aria-label="Home">${v==="home"?I.home(26):I.homeO(26)}</button><button onclick="show('explore')" aria-label="Search">${I.search(26)}</button><button aria-label="Create">${I.plus(26)}</button><button onclick="show('reels')" aria-label="Reels">${I.reel(26,v==="reels")}</button><button aria-label="Profile"><span class="pf" style="background-image:url(${U(ME,80,80)})"></span></button>`;
  setDark();
}

// ---------- ad format selector ----------
const FMTS = [["Reels ads","reels","Zara, Acer"],["Stories ads","stories","Coach, Cadillac, Nike"],["Feed ads","feed","Gap, Mercedes, LEGO"],["Explore tiles","explore","Levi's, Bentley, Bose"],["Messages","dm","Nike, Airbnb, BARK"]];
function toggleGuide(force){
  const p=$("#gpanel"), on = typeof force==="boolean" ? force : !p.classList.contains("on");
  p.classList.toggle("on",on); $("#gscrim").classList.toggle("on",on); $("#gpill").setAttribute("aria-expanded",on);
}
function pulse(el){ if(!el) return; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
function jump(f){
  toggleGuide(false); closeSite(); closeDM();
  if(f==="dm"){ openDM(0); pulse($("#dm .fcard")); return; }
  document.querySelectorAll(".gitem").forEach(el=>el.classList.toggle("cur",el.dataset.f===f));
  if(f==="stories"){ openStory(STORIES.findIndex(p=>p.ad)); pulse($("#story .smedia")); return; }
  closeStory();
  if(f==="explore"){ show("explore"); $("#xgrid").scrollTop=0; pulse($('#xgrid [data-fmt="explore"]')); }
  else if(f==="reels"){ show("reels"); const el=$('#reels [data-fmt="reels"]'); $("#reels").scrollTop=el.offsetTop; pulse(el.querySelector(".rfl")); }
  else { show("home"); const el=$('#feed [data-fmt="feed"]'); $("#feed").scrollTop=el.offsetTop-$("#feed").offsetTop-40; pulse(el.querySelector(".media")); }
}
function fitPhone(){
  const ph=$("#phone"); if(innerWidth<=600){ ph.style.transform=""; return; }
  ph.style.transform=`scale(${Math.min(1,(innerHeight-32)/868,(innerWidth-32)/414)})`;
}
addEventListener("resize",fitPhone);

$("#hdic").innerHTML=`<span class="dot">${I.heart(26)}</span><button class="dot" onclick="openDM()" aria-label="Messages">${I.chat(26)}</button>`;
$("#rcam").innerHTML=I.cam(26);
$("#gpanel").innerHTML=`<h6>Flicks on Instagram</h6>`+FMTS.map(([t,f,b],i)=>`<button class="gitem" data-f="${f}" onclick="jump('${f}')"><span class="n">${i+1}</span>${t}<span class="b">${b}</span></button>`).join("");
$("#srch").innerHTML=I.search(17)+"<span>Search</span>";
renderFeed(); renderReels(); renderExplore(); show("home"); fitPhone();
const H0=location.hash.replace("#",""); if(["reels","stories","feed","explore","dm"].includes(H0)) setTimeout(()=>jump(H0),300);
</script>
